name: Backend CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected main branch commit to the configured VPS
        required: true
        type: boolean
        default: false
      bootstrap:
        description: Install the isolated watcher into an empty VPS project
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/hugoalves-dev/ia-hugo-do-zap

jobs:
  test-and-build:
    name: Test and build (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check workflow and VPS deploy contracts
        run: python3 -B -m unittest discover -s tests/ci -p 'test*.py'

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify and package
        run: mvn -B -ntp verify

  publish-image:
    name: Publish immutable image
    needs: test-and-build
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  deploy-vps:
    name: Deploy selected main commit to VPS
    needs: publish-image
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          (inputs.deploy == true || inputs.bootstrap == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: watcher-vps-deploy
      cancel-in-progress: false
    env:
      VPS_DEPLOY_DIR: ${{ vars.VPS_DEPLOY_DIR || '/docker/ia-hugo-do-zap' }}
      DEPLOY: ${{ inputs.deploy }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Compute Compose file identity
        id: compose
        run: echo "sha256=$(sha256sum compose.yaml | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Validate SSH settings and derive host fingerprint
        id: ssh
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          COMPOSE_SHA256: ${{ steps.compose.outputs.sha256 }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.publish-image.outputs.digest }}
        run: |
          set -euo pipefail

          for name in SSH_KEY SSH_PORT VPS_IP VPS_USER VPS_KNOWN_HOSTS VPS_DEPLOY_DIR IMAGE_REF COMPOSE_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required deployment setting: $name" >&2
              exit 1
            fi
          done

          if [[ ! "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$SSH_PORT < 1 || 10#$SSH_PORT > 65535 )); then
            echo "SSH_PORT must be between 1 and 65535" >&2
            exit 1
          fi

          if [[ ! "$VPS_DEPLOY_DIR" =~ ^/[A-Za-z0-9._/-]+$ || "$VPS_DEPLOY_DIR" == / || "$VPS_DEPLOY_DIR" == */ || "$VPS_DEPLOY_DIR" == *//* || "$VPS_DEPLOY_DIR" == */../* || "$VPS_DEPLOY_DIR" == */./* || "$VPS_DEPLOY_DIR" == */.. || "$VPS_DEPLOY_DIR" == */. ]]; then
            echo "VPS_DEPLOY_DIR must be a safe, normalized absolute path." >&2
            exit 1
          fi

          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+@sha256:[a-f0-9]{64}$ || ! "$COMPOSE_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "IMAGE_REF and COMPOSE_SHA256 must be immutable SHA-256 values." >&2
            exit 1
          fi

          if [[ "$DEPLOY" == true && "$BOOTSTRAP" == true ]]; then
            echo "Select either deploy or bootstrap, not both." >&2
            exit 1
          elif [[ "$BOOTSTRAP" == true ]]; then
            MODE=bootstrap
          elif [[ "$DEPLOY" == true ]]; then
            MODE=deploy
          else
            echo "Select deploy or bootstrap for this manual run." >&2
            exit 1
          fi

          known_hosts_file="$RUNNER_TEMP/vps_known_hosts"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$known_hosts_file"
          trap 'rm -f -- "$known_hosts_file"' EXIT

          known_host="$VPS_IP"
          if [[ "$SSH_PORT" != 22 ]]; then
            known_host="[$VPS_IP]:$SSH_PORT"
          fi
          known_host_entries="$(ssh-keygen -F "$known_host" -f "$known_hosts_file")" || {
            echo "VPS_KNOWN_HOSTS does not contain the configured VPS host and port." >&2
            exit 1
          }
          if printf '%s\n' "$known_host_entries" | awk '!/^#/ && $1 ~ /^@/ { marked = 1 } END { exit !marked }'; then
            echo "VPS_KNOWN_HOSTS entries marked with @ are not supported." >&2
            exit 1
          fi
          mapfile -t host_keys < <(printf '%s\n' "$known_host_entries" | awk '!/^#/ && NF >= 3 && $1 !~ /^@/ { print $2, $3 }' | sort -u)
          if (( ${#host_keys[@]} != 1 )); then
            echo "VPS_KNOWN_HOSTS must resolve to exactly one verified host public key." >&2
            exit 1
          fi
          host_key_file="$RUNNER_TEMP/vps_host_key.pub"
          printf '%s\n' "${host_keys[0]}" > "$host_key_file"
          fingerprint="$(ssh-keygen -lf "$host_key_file" -E sha256 | awk '{print $2}')"
          rm -f -- "$host_key_file"
          [[ "$fingerprint" =~ ^SHA256:[A-Za-z0-9+/]+$ ]] || {
            echo "Could not derive a valid SHA-256 host fingerprint." >&2
            exit 1
          }

          deploy_dir_b64="$(printf '%s' "$VPS_DEPLOY_DIR" | base64 --wrap=0)"
          image_ref_b64="$(printf '%s' "$IMAGE_REF" | base64 --wrap=0)"
          deploy_script_b64="$(base64 --wrap=0 scripts/deploy-vps.sh)"
          printf 'DEPLOY_SCRIPT_B64=%s\nVPS_DEPLOY_DIR_B64=%s\nIMAGE_REF_B64=%s\nCOMPOSE_SHA256=%s\nDEPLOY_MODE=%s\n' \
            "$deploy_script_b64" "$deploy_dir_b64" "$image_ref_b64" "$COMPOSE_SHA256" "$MODE" >> "$GITHUB_ENV"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Deploy watcher by immutable image digest
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          DRONE_SSH_VERSION: 1.8.1
          DEPLOY_SCRIPT_B64: ${{ env.DEPLOY_SCRIPT_B64 }}
          VPS_DEPLOY_DIR_B64: ${{ env.VPS_DEPLOY_DIR_B64 }}
          IMAGE_REF_B64: ${{ env.IMAGE_REF_B64 }}
          COMPOSE_SHA256: ${{ env.COMPOSE_SHA256 }}
          DEPLOY_MODE: ${{ env.DEPLOY_MODE }}
        with:
          host: ${{ secrets.VPS_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ steps.ssh.outputs.fingerprint }}
          command_timeout: 15m
          envs: DEPLOY_SCRIPT_B64,VPS_DEPLOY_DIR_B64,IMAGE_REF_B64,COMPOSE_SHA256,DEPLOY_MODE
          script_path: scripts/deploy-vps-action.sh
