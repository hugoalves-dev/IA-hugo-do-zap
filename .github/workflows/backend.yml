name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/hugoalves-dev/ia-hugo-do-zap

jobs:
  test-and-build:
    name: Test and build (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check workflow and VPS deploy contracts
        run: python3 -B -m unittest discover -s tests/ci -p 'test*.py'

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify and package
        run: mvn -B -ntp verify

  publish-image:
    name: Publish immutable image
    needs: test-and-build
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  deploy-vps:
    name: Auto-deploy watcher to VPS
    needs: publish-image
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: watcher-vps-deploy
      cancel-in-progress: false
    env:
      VPS_DEPLOY_DIR: ${{ vars.VPS_DEPLOY_DIR || '/docker/ia-hugo-do-zap' }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Validate and package deployment
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.publish-image.outputs.digest }}
        run: |
          set -euo pipefail
          for name in SSH_KEY SSH_PORT VPS_IP VPS_USER VPS_DEPLOY_DIR IMAGE_REF; do
            if [[ -z "${!name}" ]]; then
              echo "Missing deployment setting: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$SSH_PORT < 1 || 10#$SSH_PORT > 65535 )); then
            echo "Invalid SSH_PORT" >&2
            exit 1
          fi
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid immutable GHCR image reference" >&2
            exit 1
          fi
          echo "DEPLOY_SCRIPT_B64=$(base64 --wrap=0 scripts/deploy-vps.sh)" >> "$GITHUB_ENV"
          echo "VPS_DEPLOY_DIR_B64=$(printf '%s' "$VPS_DEPLOY_DIR" | base64 --wrap=0)" >> "$GITHUB_ENV"
          echo "IMAGE_REF_B64=$(printf '%s' "$IMAGE_REF" | base64 --wrap=0)" >> "$GITHUB_ENV"
          echo "COMPOSE_CONTENT_B64=$(base64 --wrap=0 compose.yaml)" >> "$GITHUB_ENV"
          echo "COMPOSE_SHA256=$(sha256sum compose.yaml | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Update watcher and verify health
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          DRONE_SSH_VERSION: 1.8.1
          DEPLOY_SCRIPT_B64: ${{ env.DEPLOY_SCRIPT_B64 }}
          VPS_DEPLOY_DIR_B64: ${{ env.VPS_DEPLOY_DIR_B64 }}
          IMAGE_REF_B64: ${{ env.IMAGE_REF_B64 }}
          COMPOSE_CONTENT_B64: ${{ env.COMPOSE_CONTENT_B64 }}
          COMPOSE_SHA256: ${{ env.COMPOSE_SHA256 }}
        with:
          host: ${{ secrets.VPS_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          envs: DEPLOY_SCRIPT_B64,VPS_DEPLOY_DIR_B64,IMAGE_REF_B64,COMPOSE_CONTENT_B64,COMPOSE_SHA256
          script_path: scripts/deploy-vps-action.sh
