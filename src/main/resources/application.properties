# Explicit aliases preserve the operator-facing underscore-separated environment contract.
watcher.telegram.admin.polling-enabled=${WATCHER_TELEGRAM_ADMIN_POLLING_ENABLED:false}
watcher.telegram.admin.user-id=${WATCHER_TELEGRAM_ADMIN_USER_ID:}
watcher.telegram.admin.webhook-enabled=${WATCHER_TELEGRAM_ADMIN_WEBHOOK_ENABLED:false}
watcher.telegram.admin.webhook-secret=${WATCHER_TELEGRAM_ADMIN_WEBHOOK_SECRET:}
watcher.telegram.admin.mini-app-url=${WATCHER_TELEGRAM_ADMIN_MINI_APP_URL:}
watcher.ai.classification-enabled=${WATCHER_AI_CLASSIFICATION_ENABLED:false}
watcher.ai.context-window-hours=${WATCHER_AI_CONTEXT_WINDOW_HOURS:24}
watcher.ai.open-router-max-tokens=${WATCHER_AI_OPENROUTERMAXTOKENS:300}
watcher.ai.open-router-reasoning-enabled=${WATCHER_AI_OPENROUTERREASONINGENABLED:false}
watcher.ai.disable-local-budget=${WATCHER_AI_DISABLE_LOCAL_BUDGET:false}
watcher.ai.require-chat-consent=${WATCHER_AI_REQUIRE_CHAT_CONSENT:true}
watcher.ai.allow-unbudgeted-gemini-fallback=${WATCHER_AI_ALLOW_UNBUDGETED_GEMINI_FALLBACK:false}
watcher.automation.kill-switch-enabled=${WATCHER_AUTOMATION_KILL_SWITCH_ENABLED:true}
watcher.automation.intelligent-alerts-enabled=${WATCHER_AUTOMATION_INTELLIGENT_ALERTS_ENABLED:false}
watcher.automation.auto-reply-enabled=${WATCHER_AUTOMATION_AUTO_REPLY_ENABLED:false}
management.endpoints.web.exposure.include=health,prometheus
watcher.rabbitmq.enabled=${WATCHER_RABBITMQ_ENABLED:false}
watcher.rabbitmq.exchange=${WATCHER_RABBITMQ_EXCHANGE:watcher.events}
watcher.rabbitmq.confirm-timeout=${WATCHER_RABBITMQ_CONFIRM_TIMEOUT:5s}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
