services:
  watcher:
    profiles: ["prod"]
    image: ${WATCHER_IMAGE:-ghcr.io/hugoalves-dev/ia-hugo-do-zap:latest}
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      TZ: ${TZ:-America/Sao_Paulo}
      WATCHER_TIMEZONE: ${WATCHER_TIMEZONE:-America/Sao_Paulo}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set the existing PostgreSQL watcher database URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set the dedicated watcher database role}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set the watcher database password}
      WATCHER_RABBITMQ_ENABLED: "true"
      WATCHER_RABBITMQ_NATIVE_EVOLUTION_ENABLED: ${WATCHER_NATIVE_EVOLUTION_ENABLED:-false}
      WATCHER_RABBITMQ_NATIVE_EVOLUTION_EXCHANGE: ${WATCHER_NATIVE_EVOLUTION_EXCHANGE:-watcher.evolution}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-watcher}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set the RabbitMQ password}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-watcher}
      WATCHER_TELEGRAM_BOT_TOKEN: ${WATCHER_TELEGRAM_BOT_TOKEN:?Set the Telegram bot token}
      WATCHER_TELEGRAM_CHAT_ID: ${WATCHER_TELEGRAM_CHAT_ID:?Set the private Telegram chat ID}
      WATCHER_TELEGRAM_ADMIN_POLLING_ENABLED: ${WATCHER_TELEGRAM_ADMIN_POLLING_ENABLED:-false}
      WATCHER_TELEGRAM_ADMIN_WEBHOOK_ENABLED: ${WATCHER_TELEGRAM_ADMIN_WEBHOOK_ENABLED:-false}
      WATCHER_TELEGRAM_ADMIN_WEBHOOK_SECRET: ${WATCHER_TELEGRAM_ADMIN_WEBHOOK_SECRET:-}
      WATCHER_TELEGRAM_ADMIN_MINI_APP_URL: ${WATCHER_TELEGRAM_ADMIN_MINI_APP_URL:-}
      WATCHER_TELEGRAM_ADMIN_USER_ID: ${WATCHER_TELEGRAM_ADMIN_USER_ID:-}
      WATCHER_EVOLUTION_WEBHOOK_TOKEN: ${WATCHER_EVOLUTION_WEBHOOK_TOKEN:?Set a separate Evolution webhook bearer token}
      WATCHER_EVOLUTION_INSTANCE: ${WATCHER_EVOLUTION_INSTANCE:-watcher-evolution}
      WATCHER_SIMULATION_ENABLED: ${WATCHER_SIMULATION_ENABLED:-true}
      WATCHER_DECISION_PRODUCER_REAL_MODE_ENABLED: ${WATCHER_DECISION_PRODUCER_REAL_MODE_ENABLED:-false}
      WATCHER_WHATSAPP_ACTIONS_REAL_SEND_ENABLED: "false"
      WATCHER_WHATSAPP_ACTIONS_EVOLUTION_ENABLED: "false"
      WATCHER_WHATSAPP_ACTIONS_EVOLUTION_BASE_URL: ${WATCHER_WHATSAPP_ACTIONS_EVOLUTION_BASE_URL:-http://evolution-api:8080}
      WATCHER_WHATSAPP_ACTIONS_EVOLUTION_INSTANCE: ${WATCHER_WHATSAPP_ACTIONS_EVOLUTION_INSTANCE:-${WATCHER_EVOLUTION_INSTANCE:-watcher-evolution}}
      WATCHER_WHATSAPP_ACTIONS_EVOLUTION_API_KEY: ${WATCHER_WHATSAPP_ACTIONS_EVOLUTION_API_KEY:-}
      WATCHER_WHATSAPP_ACTIONS_EVOLUTION_TIMEOUT: ${WATCHER_WHATSAPP_ACTIONS_EVOLUTION_TIMEOUT:-15s}
      WATCHER_WHATSAPP_ACTIONS_OWNER_JID: ${WATCHER_WHATSAPP_ACTIONS_OWNER_JID:-}
      WATCHER_AUTOMATION_KILL_SWITCH_ENABLED: ${WATCHER_AUTOMATION_KILL_SWITCH_ENABLED:-true}
      WATCHER_AUTOMATION_INTELLIGENT_ALERTS_ENABLED: ${WATCHER_AUTOMATION_INTELLIGENT_ALERTS_ENABLED:-false}
      WATCHER_AUTOMATION_AUTO_REPLY_ENABLED: ${WATCHER_AUTOMATION_AUTO_REPLY_ENABLED:-false}
      WATCHER_AI_CLASSIFICATION_ENABLED: ${WATCHER_AI_CLASSIFICATION_ENABLED:-false}
      WATCHER_AI_DISABLE_LOCAL_BUDGET: ${WATCHER_AI_DISABLE_LOCAL_BUDGET:-false}
      WATCHER_AI_REQUIRE_CHAT_CONSENT: ${WATCHER_AI_REQUIRE_CHAT_CONSENT:-true}
      WATCHER_AI_ALLOW_UNBUDGETED_GEMINI_FALLBACK: ${WATCHER_AI_ALLOW_UNBUDGETED_GEMINI_FALLBACK:-false}
      WATCHER_AI_TRIAGE_LEGACY_FILTER_ENABLED: ${WATCHER_AI_TRIAGE_LEGACY_FILTER_ENABLED:-false}
      WATCHER_AI_ENABLED: ${WATCHER_AI_ENABLED:-false}
      WATCHER_AI_GEMINIAPIKEY: ${WATCHER_AI_GEMINIAPIKEY:-}
      WATCHER_AI_GEMINIMODEL: ${WATCHER_AI_GEMINIMODEL:-}
      WATCHER_AI_OPENROUTERAPIKEY: ${WATCHER_AI_OPENROUTERAPIKEY:-}
      WATCHER_AI_OPENROUTERMODEL: ${WATCHER_AI_OPENROUTERMODEL:-}
      WATCHER_AI_OPENROUTERMAXTOKENS: ${WATCHER_AI_OPENROUTERMAXTOKENS:-300}
      WATCHER_AI_OPENROUTERREASONINGENABLED: ${WATCHER_AI_OPENROUTERREASONINGENABLED:-false}
      WATCHER_AI_ATTEMPTHOLDMICROS: ${WATCHER_AI_ATTEMPTHOLDMICROS:-0}
      WATCHER_AI_TIMEOUT: ${WATCHER_AI_TIMEOUT:-15s}
      WATCHER_AI_CONTEXT_WINDOW_HOURS: ${WATCHER_AI_CONTEXT_WINDOW_HOURS:-24}
      WATCHER_NOTIFICATION_DAYS: ${WATCHER_NOTIFICATION_DAYS:-1,2,3,4,5}
      WATCHER_NOTIFICATION_WINDOWS_0_START: ${WATCHER_NOTIFICATION_WINDOWS_0_START:-08:00}
      WATCHER_NOTIFICATION_WINDOWS_0_END: ${WATCHER_NOTIFICATION_WINDOWS_0_END:-12:00}
      WATCHER_NOTIFICATION_WINDOWS_1_START: ${WATCHER_NOTIFICATION_WINDOWS_1_START:-13:30}
      WATCHER_NOTIFICATION_WINDOWS_1_END: ${WATCHER_NOTIFICATION_WINDOWS_1_END:-17:30}
      WATCHER_ALLOWED_NAME_REGEX: ${WATCHER_ALLOWED_NAME_REGEX:-(^|[^A-Z0-9])JC([^A-Z0-9]|$)}
      WATCHER_INCLUDE_GROUPS: ${WATCHER_INCLUDE_GROUPS:-true}
      WATCHER_NEVER_NOTIFY_GROUP_NAMES_0: ${WATCHER_NEVER_NOTIFY_GROUP_NAMES_0:-233/234}
      WATCHER_MAX_BATCH_SIZE: ${WATCHER_MAX_BATCH_SIZE:-50}
      WATCHER_RETENTION_DAYS: ${WATCHER_RETENTION_DAYS:-7}
      WATCHER_SIMULATION_ACTIVECONVERSATIONWINDOWMINUTES: ${WATCHER_SIMULATION_ACTIVECONVERSATIONWINDOWMINUTES:-60}
      WATCHER_SIMULATION_GROUPNOTIFICATIONMAXAGEMINUTES: ${WATCHER_SIMULATION_GROUPNOTIFICATIONMAXAGEMINUTES:-60}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db,rabbit
    networks:
      - infra_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  evolution-api:
    profiles: ["prod"]
    image: ${EVOLUTION_IMAGE:?Set the official Evolution API image pinned by tag and digest}
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://evolution-api:8080}
      SERVER_DISABLE_DOCS: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DATABASE_URL:?Set the separate Evolution PostgreSQL database URL}
      DATABASE_CONNECTION_CLIENT_NAME: watcher-evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "true"
      RABBITMQ_ENABLED: ${EVOLUTION_RABBITMQ_ENABLED:-false}
      RABBITMQ_URI: ${EVOLUTION_RABBITMQ_URI:-amqp://localhost}
      RABBITMQ_EXCHANGE_NAME: ${EVOLUTION_RABBITMQ_EXCHANGE:-watcher.evolution}
      RABBITMQ_GLOBAL_ENABLED: ${EVOLUTION_RABBITMQ_GLOBAL_ENABLED:-false}
      RABBITMQ_GLOBAL_EXTERNAL_QUEUE: ${EVOLUTION_RABBITMQ_GLOBAL_EXTERNAL_QUEUE:-true}
      RABBITMQ_EVENTS_MESSAGES_UPSERT: ${EVOLUTION_RABBITMQ_EVENTS_MESSAGES_UPSERT:-false}
      RABBITMQ_EVENTS_CONNECTION_UPDATE: ${EVOLUTION_RABBITMQ_EVENTS_CONNECTION_UPDATE:-false}
      RABBITMQ_EVENTS_CONTACTS_UPSERT: ${EVOLUTION_RABBITMQ_EVENTS_CONTACTS_UPSERT:-false}
      RABBITMQ_EVENTS_CONTACTS_UPDATE: ${EVOLUTION_RABBITMQ_EVENTS_CONTACTS_UPDATE:-false}
      RABBITMQ_EVENTS_CHATS_SET: ${EVOLUTION_RABBITMQ_EVENTS_CHATS_SET:-false}
      RABBITMQ_EVENTS_CHATS_UPSERT: ${EVOLUTION_RABBITMQ_EVENTS_CHATS_UPSERT:-false}
      RABBITMQ_EVENTS_CHATS_UPDATE: ${EVOLUTION_RABBITMQ_EVENTS_CHATS_UPDATE:-false}
      WEBHOOK_RETRY_MAX_ATTEMPTS: "10"
      WEBHOOK_RETRY_INITIAL_DELAY_SECONDS: "1"
      WEBHOOK_RETRY_USE_EXPONENTIAL_BACKOFF: "true"
      WEBHOOK_RETRY_MAX_DELAY_SECONDS: "60"
      WEBHOOK_RETRY_JITTER_FACTOR: "0.2"
      WEBHOOK_RETRY_NON_RETRYABLE_STATUS_CODES: "400,401,403,404,422"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Set the Evolution API key}
      # The upstream LOG/WEBHOOKS categories print full webhook payloads (including apikey).
      # Keep only operational warnings/errors; Spring logging settings do not affect Evolution.
      LOG_LEVEL: "ERROR,WARN"
    ports:
      - "127.0.0.1:${EVOLUTION_HOST_PORT:-8080}:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - infra_network

  rabbitmq:
    profiles: ["prod"]
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.4.0-management-alpine@sha256:b768d2e09a809b48458d6c3c32fc2894643a6bfafd76264c120373eff0ee6532}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: "1.0"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-watcher}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set the RabbitMQ password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-watcher}
    volumes:
      - watcher_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - infra_network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          rabbitmq-diagnostics -q ping &&
          rabbitmqctl set_user_tags "$${RABBITMQ_DEFAULT_USER}" &&
          rabbitmqctl set_permissions -p "$${RABBITMQ_DEFAULT_VHOST}" "$${RABBITMQ_DEFAULT_USER}"
          '^watcher\.' '^watcher\.' '^watcher\.'
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  postgres-local-watcher:
    profiles: ["local-db"]
    image: ${LOCAL_POSTGRES_IMAGE:-postgres:17.11-alpine3.23@sha256:01ea903aa65deb58eb49d6e09d859ecff63a6bb7d61feca55f2abad71d08f72a}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_WATCHER_DB_NAME:?Set the local watcher database name}
      POSTGRES_USER: ${LOCAL_WATCHER_DB_USER:?Set the local watcher database role}
      POSTGRES_PASSWORD: ${LOCAL_WATCHER_DB_PASSWORD:?Set a local-only watcher database password}
    volumes:
      - local_watcher_postgres_data:/var/lib/postgresql/data
    networks:
      - infra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-local-evolution:
    profiles: ["local-db"]
    image: ${LOCAL_POSTGRES_IMAGE:-postgres:17.11-alpine3.23@sha256:01ea903aa65deb58eb49d6e09d859ecff63a6bb7d61feca55f2abad71d08f72a}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_EVOLUTION_DB_NAME:?Set the local Evolution database name}
      POSTGRES_USER: ${LOCAL_EVOLUTION_DB_USER:?Set the local Evolution database role}
      POSTGRES_PASSWORD: ${LOCAL_EVOLUTION_DB_PASSWORD:?Set a local-only Evolution database password}
    volumes:
      - local_evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - infra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evolution_instances:
  watcher_rabbitmq_data:
  local_watcher_postgres_data:
  local_evolution_postgres_data:

networks:
  infra_network:
    external: true
    name: infra_network
